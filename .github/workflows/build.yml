name: build ladybird

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      no_cache:
        type: boolean
        default: false
        description: disable cache
      clean_build:
        type: boolean
        default: false
        description: clean build directory before building

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LADYBIRD_SOURCE_DIR: ${{ github.workspace }}/ladybird
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ladybirdbrowser/ladybird-ci:2026.07.29

    steps:
    - name: checkout repository
      uses: actions/checkout@v6.0.2
      with:
        submodules: false
        fetch-depth: 1

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: get current date
      id: date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        echo "build_id=$(date +'%Y-%m-%d-%H%M')-${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT
    - name: install missing runtime dependencies
      run: |
        apt-get update
        apt-get install -y sudo libxcb-xinput-dev libxcb-cursor0 libxcb-xinerama0 libxcb-cursor-dev python3 python3-pip python3-venv

    - name: install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.9.*'
        modules: 'qtpositioning'
        setup-python: false
      env:
        PIP_BREAK_SYSTEM_PACKAGES: "1"

    - name: verify Qt installation
      run: test -f "$QT_ROOT_DIR/lib/cmake/Qt6Positioning/Qt6PositioningConfig.cmake"

    - name: setup ladybird source
      run: python3 ladybird.py setup

    - name: read vcpkg baseline
      id: vcpkg_baseline
      run: |
        baseline=$(python3 -c 'import json; print(json.load(open("ladybird/vcpkg.json"))["builtin-baseline"])')
        echo "commit=$baseline" >> "$GITHUB_OUTPUT"

    - name: setup vcpkg
      uses: friendlyanon/setup-vcpkg@v1
      with:
        path: ladybird/Build/vcpkg
        committish: ${{ steps.vcpkg_baseline.outputs.commit }}
        cache: ${{ !inputs.no_cache }}
        cache-key: vcpkg-${{ runner.os }}-${{ hashFiles('ladybird/vcpkg.json') }}-${{ steps.vcpkg_baseline.outputs.commit }}
        cache-restore-keys: |
          vcpkg-${{ runner.os }}-${{ hashFiles('ladybird/vcpkg.json') }}-
          vcpkg-${{ runner.os }}-

    - name: build ladybird
      run: |
        BUILD_FLAGS=""
        if [ "${{ inputs.clean_build }}" = "true" ]; then
          BUILD_FLAGS="--clean"
        fi
        python3 ladybird.py build $BUILD_FLAGS

    - name: package ladybird (appimage)
      run: python3 ladybird.py package --name Ladybird-${{ steps.date.outputs.build_id }}

    - name: show sccache stats
      if: always()
      run: sccache --show-stats

    - name: upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: ladybird-linux-x64-${{ steps.date.outputs.build_id }}
        path: output/*
        retention-days: 30

    - name: create release
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: nightly-${{ steps.date.outputs.date }}
        name: Nightly Build ${{ steps.date.outputs.date }}
        body: |
          ladybird ${{ steps.date.outputs.date }} build
        files: output/*
        overwrite_files: false
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
